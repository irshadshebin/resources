<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Irshad Shebin — Free Excel & Finance Resources</title>
<meta name="description" content="Free Excel Dashboards, Accounting Templates, and Taxation Guides by Irshad Shebin." />
<meta property="og:title" content="Irshad Shebin — Free Excel & Finance Resources" />
<meta property="og:description" content="Download free Excel dashboards, practice files, and step-by-step finance & taxation guides." />
<meta property="og:image" content="https://github.io" />
<meta property="og:url" content="https://github.io" />
<meta property="og:type" content="website" />
<link rel="icon" type="image/png" href="profile.png" />
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #F0FDF4 60%, #DCFCE7 100%);
    color: #0F172A;
    min-height: 100vh;
    padding: 36px 16px 60px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  .profile { text-align: center; margin-bottom: 22px; }
  .profile img {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 10px 24px rgba(15,23,42,0.12);
  }
    .profile h1 { font-size: 22px; font-weight: 800; margin-top: 12px; text-align: center; }
  .profile-role {
    display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px;
    background: #ECFDF5; color: #107C41; border: 1px solid #A7F3D0;
    font-size: 12px; font-weight: 800; letter-spacing: 0.4px;
  }
  .profile p { font-size: 13px; font-weight: 600; color: #475569; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
  .search-wrap { margin-bottom: 18px; }
  .search-input {
    width: 100%; padding: 12px 16px; border-radius: 14px;
    border: 1.5px solid #D1FAE5; background: #FFFFFF;
    font-family: inherit; font-size: 14px; color: #0F172A;
    box-shadow: 0 4px 12px rgba(15,23,42,0.04); outline: none;
  }
  .search-input:focus { border-color: #107C41; }
  .cat-pills { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
  .cat-pills::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: #FFFFFF; color: #475569; border: 1.5px solid #D1FAE5;
    padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
  }
  .cat-pill.active { background: #107C41; color: #FFFFFF; border-color: #107C41; }
   .card {
    background: #FFFFFF; border-radius: 20px; padding: 24px 20px;
    border: 1.5px solid #D1FAE5;
    box-shadow: 0 16px 38px rgba(15,23,42,0.07);
    margin-bottom: 22px;
    text-align: left;
    scroll-margin-top: 24px;
  }
  .consult-card {
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    color: #FFFFFF; border: none;
  }
  .consult-card h2 { color: #FFFFFF !important; }
  .consult-card p { color: #CBD5E1 !important; }
  .consult-card .badge { background: rgba(16,185,129,0.16); color: #6EE7B7; }
  .contact-subrow { display: flex; gap: 10px; margin-top: 10px; }
  .contact-subbtn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
    text-decoration: none; color: #E2E8F0; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease;
  }
  .contact-subbtn:hover { background: rgba(255,255,255,0.15); }
  .badge {
    display: inline-block; background: #ECFDF5; color: #107C41;
    font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 12px;
  }
  .card h2 { font-size: clamp(19px, 5vw, 22px); font-weight: 800; line-height: 1.25; color: #0F172A; }
  .card p { font-size: clamp(13.5px, 3.6vw, 14.5px); color: #475569; line-height: 1.55; margin: 8px 0 20px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; text-align: center; text-decoration: none;
    font-weight: 800; font-size: clamp(13px, 3.6vw, 15px);
    padding: 15px 14px; border-radius: 12px; margin-bottom: 12px;
    background: linear-gradient(180deg, #138D4A 0%, #107C41 100%);
    color: #FFFFFF; border: 1px solid #0E6B38; border-bottom: 4px solid #094D28;
    box-shadow: 0 6px 16px rgba(16,124,65,0.24);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .btn:last-child { margin-bottom: 0; }
  .dl-tip {
    display: none; text-align: center; font-size: 12px; font-weight: 600;
    color: #107C41; background: #ECFDF5; border: 1px solid #A7F3D0;
    padding: 10px 12px; border-radius: 12px; margin-bottom: 18px;
  }
    .pill-wrap { text-align: center; margin-bottom: 20px; }
  .pill-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 22px; }
  .portfolio-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: #107C41; text-decoration: none;
    padding: 10px 18px; border-radius: 999px; background: #FFFFFF;
    border: 1.5px solid #A7F3D0; box-shadow: 0 4px 12px rgba(15,23,42,0.05);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .portfolio-pill:hover { transform: translateY(-1px); border-color: #107C41; }
    .contact-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 13px 16px; border-radius: 12px; margin-bottom: 10px;
    background: #F8FAFC; color: #0F172A; border: 1.5px solid #E2E8F0;
    font-weight: 700; font-size: 14px; text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .contact-btn:hover { background: #F1F5F9; border-color: #CBD5E1; transform: translateY(-1px); }
  .contact-btn:last-child { margin-bottom: 0; }
  .footer { text-align: center; margin-top: 6px; }
  .footer-label { font-size: 13px; color: #475569; font-weight: 700; margin-bottom: 12px; }
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .social-link { display: inline-flex; transition: transform 0.15s ease; }
  .social-link:hover { transform: scale(1.12); }
</style>
<script>
  window.goatcounter = { path: function(p) { return p + location.hash; } };
</script>
<script data-goatcounter="https://goatcounter.com" async src="https://zgo.at"></script>
</head>
<body>
  <div class="wrap">
    <div class="profile">
      <img id="profile-img" src="profile.png" alt="Irshad Shebin" />
      <h1 id="profile-name">Irshad Shebin</h1>
      <p id="profile-tagline">Finance &nbsp;|&nbsp; Accounting &nbsp;|&nbsp; Taxation</p>
    </div>

    <div id="search-section" class="search-wrap" style="display:none;">
      <input id="search-input" class="search-input" type="text" placeholder="Search Excel, GST, Income Tax, templates..." />
      <div id="cat-pills" class="cat-pills"></div>
    </div>

    <div id="dl-tip" class="dl-tip">Downloading file... If inside Instagram/Facebook browser, tap <b>⋮</b> → <b>Open in Chrome/Safari</b> if download doesn't start.</div>

    <div id="dynamic-sections"></div>

    <div id="footer-section" class="footer">
      <div class="footer-label" id="footer-label">Follow @irshadshebin</div>
      <div class="socials" id="socials-container"></div>
    </div>
  </div>
  <script>
    const icon = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    const socialIcons = {
      linkedin: '<svg width="28" height="28" viewBox="0 0 24 24" fill="#0A66C2"><path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.92 11.24V10.13H10.13V18.5H12.92V13.57C12.92 12.8 13.54 12.17 14.31 12.17A1.4 1.4 0 0 1 15.71 13.57V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z"/></svg>',
      instagram: '<svg width="28" height="28" viewBox="0 0 24 24"><defs><radialGradient id="ig-official" cx="30%" cy="107%" r="150%"><stop offset="0%" stop-color="#fdf497"/><stop offset="5%" stop-color="#fdf497"/><stop offset="45%" stop-color="#fd5949"/><stop offset="60%" stop-color="#d6249f"/><stop offset="90%" stop-color="#285AEB"/></radialGradient></defs><rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#ig-official)"/><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="3.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><circle cx="16.2" cy="7.8" r="1.1" fill="#FFFFFF"/></svg>',
      threads: '<svg width="28" height="28" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="#0F172A"/><path d="M15.7 11.4c-.1-.1-.3-.2-.4-.2-.2-2.2-1.4-3.5-3.6-3.5-1.3 0-2.4.5-3.1 1.5l1.2.8c.5-.7 1.1-1 1.9-1 1.3 0 2 .7 2.2 2-.7-.1-1.4-.2-2.2-.2-2.1 0-3.5 1.1-3.5 2.7 0 1.6 1.3 2.7 3.1 2.7 1.6 0 2.8-.7 3.3-2 .3-.6.4-1.3.4-2.1.5.3.8.8.8 1.4 0 1.6-1.4 2.9-3.6 2.9-2.5 0-4.3-1.7-4.3-4.3 0-2.6 1.8-4.4 4.3-4.4 2.1 0 3.7 1.2 4.1 3.1l1.4-.3C17.4 7.7 15.3 6 12.3 6 9 6 6.6 8.4 6.6 12c0 3.6 2.4 5.9 5.7 5.9 3 0 5-1.9 5-4.3 0-1-.5-1.8-1.6-2.2zm-4.1 3.4c-1 0-1.7-.5-1.7-1.3 0-.8.8-1.3 2.1-1.3.7 0 1.3.1 1.9.2-.1 1.5-1 2.4-2.3 2.4z" fill="#FFFFFF"/></svg>',
      youtube: '<svg width="28" height="28" viewBox="0 0 24 24"><rect x="2" y="4.5" width="20" height="15" rx="4.5" fill="#FF0033"/><polygon points="10,8.5 16,12 10,15.5" fill="#FFFFFF"/></svg>',
      facebook: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0866FF"/><path d="M15.1 12.7l.4-2.7h-2.6V8.3c0-.7.4-1.4 1.5-1.4h1.2V4.6s-1.1-.2-2.1-.2c-2.1 0-3.5 1.3-3.5 3.6v2H7.7v2.7h2.3v6.5h2.9v-6.5h2.2z" fill="#FFFFFF"/></svg>',
      x: '<svg width="28" height="28" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="#0F172A"/><path d="M13.3 10.9L17.8 5.7h-1.1l-3.9 4.5-3.1-4.5H6l4.7 6.8L6 18h1.1l4.1-4.8 3.3 4.8h3.7l-4.9-7.1zm-1.5 1.7l-.5-.7-3.8-5.4h1.6l3.1 4.4.5.7 4 5.7h-1.6l-3.3-4.7z" fill="#FFFFFF"/></svg>',
      github: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#181717"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 6.2c-3.3 0-6 2.7-6 6 0 2.6 1.7 4.9 4.1 5.7.3.1.4-.1.4-.3v-1.1c-1.7.4-2-.8-2-.8-.3-.7-.7-.9-.7-.9-.6-.4 0-.4 0-.4.6 0 1 .7 1 .7.6 1 1.5.7 1.8.5.1-.4.2-.7.4-.9-1.3-.2-2.7-.7-2.7-3 0-.7.2-1.2.6-1.6-.1-.2-.3-.8.1-1.6 0 0 .5-.2 1.6.6.5-.1 1-.2 1.5-.2.5 0 1 .1 1.5.2 1.1-.8 1.6-.6 1.6-.6.3.8.1 1.4.1 1.6.4.4.6 1 .6 1.6 0 2.3-1.4 2.8-2.7 3 .2.2.4.6.4 1.2v1.7c0 .2.1.4.4.3 2.4-.8 4.1-3.1 4.1-5.7 0-3.3-2.7-6-6-6z" fill="#FFFFFF"/></svg>'
    };
    let cfg = {}, allItems = [], activeCat = 'All', query = '';

    function buildCardsHtml(selectedId) {
      let list = selectedId ? allItems.filter(i => i.id === selectedId) : allItems;
      if (!selectedId) {
        if (activeCat !== 'All') list = list.filter(i => (i.category || 'General') === activeCat);
        if (query) list = list.filter(i => (i.title + ' ' + i.description + ' ' + (i.category || '')).toLowerCase().includes(query));
      }
      return list.map(item => {
        const btns = (item.buttons || []).map(b => {
          const rawTarget = b.file || b.url || '#';
          const cleanUrl = rawTarget.replace(/^\/+/, '');
          const isExt = cleanUrl.startsWith('http');
          return `<a class="btn" href="${cleanUrl}" target="_blank" rel="noopener" ${isExt ? '' : 'download onclick="document.getElementById(\'dl-tip\').style.display=\'block\'"'}>${icon}<span>${b.label}</span></a>`;
        }).join('');
        return `<div id="${item.id}" class="card"><span class="badge">${item.badge || 'FREE RESOURCE'}</span><h2>${item.title}</h2><p>${item.description}</p>${btns}</div>`;
      }).join('');
    }

    function buildConsultHtml() {
      let mainBtn = cfg.showWhatsappBtn !== false
        ? `<a class="btn" href="${cfg.whatsappUrl || '#'}" target="_blank" rel="noopener"><span>${cfg.whatsappBtnText || 'Chat on WhatsApp'}</span></a>`
        : '';
      let subBtns = [];
      if (cfg.showEmailBtn !== false && cfg.emailAddress) {
        subBtns.push(`<a class="contact-subbtn" href="mailto:${cfg.emailAddress}">✉️ <span>${cfg.emailBtnText || 'Send Email'}</span></a>`);
      }
      if (cfg.showTelegramBtn && cfg.telegramUrl) {
        subBtns.push(`<a class="contact-subbtn" href="${cfg.telegramUrl}" target="_blank" rel="noopener">✈️ <span>${cfg.telegramBtnText || 'Message on Telegram'}</span></a>`);
      }
      const subRow = subBtns.length ? `<div class="contact-subrow">${subBtns.join('')}</div>` : '';
      return `<div class="card consult-card"><span class="badge">${cfg.consultationBadge || '1-ON-1 CONSULTATION & INQUIRIES'}</span><h2>${cfg.consultationTitle || 'Need Tax, GST, or Excel Help?'}</h2><p>${cfg.consultationDesc || 'Book a 1-on-1 consultation or reach out directly for custom systems.'}</p>${mainBtn}${subRow}</div>`;
    }

                function buildContactPillsHtml() {
      const waIcon = '<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#25D366"/><path d="M16.6 14.3c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.2-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.7 4.3 3.8.6.3 1.1.4 1.4.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z" fill="#FFFFFF"/></svg>';
      const gmIcon = '<svg width="20" height="20" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><path d="M4.5 18V9.2L12 14.8l7.5-5.6V18h-2.8v-5.3L12 16.2l-4.7-3.5V18H4.5z" fill="#EA4335"/><path d="M4.5 9.2V7.8c0-1.1 1.2-1.7 2.1-1L12 10.9l5.4-4.1c.9-.7 2.1-.1 2.1 1v1.4L12 14.8 4.5 9.2z" fill="#EA4335"/><path d="M4.5 9.2V18h2.8v-5.3L4.5 9.2z" fill="#4285F4"/><path d="M19.5 9.2V18h-2.8v-5.3l2.8-3.5z" fill="#34A853"/><path d="M16.7 7.3L19.5 9.2V7.8c0-1.1-1.2-1.7-2.1-1l-.7.5z" fill="#FBBC05"/></svg>';
      const tgIcon = '<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#26A5E4"/><path d="M16.9 7.8L6.5 11.8c-.7.3-.7.7-.1.9l2.7.8 6.2-3.9c.3-.2.6-.1.3.1l-5 4.5-.2 2.8c.3 0 .4-.1.6-.3l1.3-1.3 2.7 2c.5.3.9.1 1-.5l1.8-8.5c.2-.7-.3-1-.9-.7z" fill="#FFFFFF"/></svg>';

      let btns = [];
      if (cfg.showWhatsappBtn !== false && cfg.whatsappUrl) {
        btns.push(`<a class="contact-btn" href="${cfg.whatsappUrl}" target="_blank" rel="noopener">${waIcon}<span>${cfg.whatsappBtnText || 'Chat on WhatsApp'}</span></a>`);
      }
      if (cfg.showEmailBtn !== false && cfg.emailAddress) {
        btns.push(`<a class="contact-btn" href="mailto:${cfg.emailAddress}">${gmIcon}<span>${cfg.emailBtnText || 'Send Email'}</span></a>`);
      }
      if (cfg.showTelegramBtn && cfg.telegramUrl) {
        btns.push(`<a class="contact-btn" href="${cfg.telegramUrl}" target="_blank" rel="noopener">${tgIcon}<span>${cfg.telegramBtnText || 'Message on Telegram'}</span></a>`);
      }
      return btns.length ? `<div class="card"><span class="badge">DIRECT CONTACT</span><h2>Have a Question or Inquiry?</h2><p>Reach out directly via WhatsApp, Email, or Telegram.</p>${btns.join('')}</div>` : '';
    }

    function renderPage(selectedId) {
      const container = document.getElementById('dynamic-sections');
      container.innerHTML = buildCardsHtml(selectedId);
      const consultOn = Boolean(cfg.showConsultationCta);
      const showViewAll = Boolean(selectedId && cfg.showViewAllBtn !== false);
      const showPortfolio = cfg.showPortfolioLink !== false;

      if (!consultOn) {
        let pills = [];
        if (showViewAll) pills.push(`<a class="portfolio-pill" href="./"><span>${cfg.viewAllBtnText || 'View All Free Resources'}</span><span>→</span></a>`);
        if (showPortfolio) pills.push(`<a class="portfolio-pill" href="${cfg.portfolioUrl || 'https://github.io'}" target="_blank" rel="noopener"><span>${cfg.portfolioBtnText || 'View My Portfolio & CV'}</span><span>↗</span></a>`);
        if (pills.length) container.innerHTML += `<div class="pill-row">${pills.join('')}</div>`;
        if (cfg.showDirectContact !== false) {
          container.innerHTML += buildContactPillsHtml();
        }
      } else {
        if (showViewAll) container.innerHTML += `<div class="pill-wrap"><a class="portfolio-pill" href="./"><span>${cfg.viewAllBtnText || 'View All Free Resources'}</span><span>→</span></a></div>`;
        container.innerHTML += buildConsultHtml();
        if (showPortfolio) container.innerHTML += `<div class="pill-wrap"><a class="portfolio-pill" href="${cfg.portfolioUrl || 'https://github.io'}" target="_blank" rel="noopener"><span>${cfg.portfolioBtnText || 'View My Portfolio & CV'}</span><span>↗</span></a></div>`;
      }
    }

    Promise.all([
      fetch('resources.json?v=' + Date.now()).then(r => r.json()),
      fetch('settings.json?v=' + Date.now()).then(r => r.json()).catch(() => ({}))
    ]).then(([resData, setData]) => {
      cfg = Object.keys(setData).length ? setData : resData;
      allItems = resData.items || [];

      if (cfg.profileImage) document.getElementById('profile-img').src = cfg.profileImage.replace(/^\/+/, '');
      if (cfg.profileName) { document.getElementById('profile-name').textContent = cfg.profileName; document.getElementById('profile-img').alt = cfg.profileName; }
      if (cfg.profileTagline) document.getElementById('profile-tagline').textContent = cfg.profileTagline;

      if (cfg.showFooterSocials === false) {
        document.getElementById('footer-section').style.display = 'none';
      } else {
        if (cfg.footerText) document.getElementById('footer-label').textContent = cfg.footerText;
        const socialsBox = document.getElementById('socials-container');
        const list = (cfg.socialsList && cfg.socialsList.length) ? cfg.socialsList : [];
        list.forEach(s => {
          if (s.enabled !== false && socialIcons[s.platform] && s.url) {
            socialsBox.innerHTML += `<a class="social-link" href="${s.url}" rel="noopener" aria-label="${s.platform}">${socialIcons[s.platform]}</a>`;
          }
        });
      }

      const selectedId = window.location.hash.replace('#', '');
      if (!selectedId && cfg.showSearchFilter) {
        document.getElementById('search-section').style.display = 'block';
        const cats = ['All', ...new Set(allItems.map(i => i.category || 'General'))];
        const pillsBox = document.getElementById('cat-pills');
        cats.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'cat-pill' + (c === 'All' ? ' active' : '');
          btn.textContent = c;
          btn.onclick = () => {
            activeCat = c;
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderPage('');
          };
          pillsBox.appendChild(btn);
        });
        document.getElementById('search-input').oninput = e => {
