<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #F0FDF4 60%, #DCFCE7 100%);
    color: #0F172A;
    min-height: 100vh;
    padding: 36px 18px 60px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  .profile { text-align: center; margin-bottom: 28px; }
  .profile img {
    width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
    border: 3px solid #107C41; box-shadow: 0 10px 25px rgba(16,124,65,0.18);
  }
  .profile h1 { font-size: 22px; font-weight: 800; margin-top: 12px; }
  .profile p { font-size: 13px; font-weight: 600; color: #475569; margin-top: 4px; }
  .card {
    background: #FFFFFF; border-radius: 20px; padding: 22px;
    border: 1.5px solid #D1FAE5;
    box-shadow: 0 16px 38px rgba(15,23,42,0.07);
    margin-bottom: 24px;
  }
  .badge {
    display: inline-block; background: #ECFDF5; color: #107C41;
    font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 10px;
  }
  .card h2 { font-size: 20px; font-weight: 800; line-height: 1.25; }
  .card p { font-size: 13.5px; color: #475569; line-height: 1.5; margin: 8px 0 18px; }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font-weight: 800; font-size: 14.5px; padding: 14px 18px; border-radius: 12px;
    margin-bottom: 11px;
    background: #107C41; color: #FFFFFF;
    box-shadow: 0 8px 20px rgba(16,124,65,0.22);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover { background: #0D6635; transform: translateY(-1px); }
  .btn:last-child { margin-bottom: 0; }
  .footer { text-align: center; margin-top: 28px; }
  .footer-label { font-size: 13px; color: #475569; font-weight: 700; margin-bottom: 12px; }
  .socials { display: flex; justify-content: center; gap: 14px; }
  .social-btn {
    width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF;
    border: 1.5px solid #D1FAE5; display: inline-flex; align-items: center;
    justify-content: center; box-shadow: 0 6px 16px rgba(15,23,42,0.06);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .social-btn:hover { transform: translateY(-2px); border-color: #107C41; }
</style>
