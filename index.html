<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Irshad Shebin — Free Excel & Finance Resources</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #F0FDF4 60%, #DCFCE7 100%);
    color: #0F172A;
    min-height: 100vh;
    padding: 36px 18px 60px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  .profile { text-align: center; margin-bottom: 28px; }
  .profile img {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 10px 24px rgba(15,23,42,0.12);
  }
  .profile h1 { font-size: 22px; font-weight: 800; margin-top: 12px; }
  .profile p { font-size: 13px; font-weight: 600; color: #475569; margin-top: 4px; }
  .card {
    background: #FFFFFF; border-radius: 20px; padding: 24px;
    border: 1.5px solid #D1FAE5;
    box-shadow: 0 16px 38px rgba(15,23,42,0.07);
    margin-bottom: 24px;
  }
  .badge {
    display: inline-block; background: #ECFDF5; color: #107C41;
    font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 10px;
  }
  .card h2 { font-size: 20px; font-weight: 800; line-height: 1.25; }
  .card p { font-size: 13.5px; color: #475569; line-height: 1.5; margin: 8px 0 20px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; text-align: center; text-decoration: none;
    font-weight: 800; font-size: 15px; padding: 15px 20px; border-radius: 12px;
    margin-bottom: 12px; cursor: pointer;
    background: linear-gradient(180deg, #138D4A 0%, #107C41 100%);
    color: #FFFFFF;
    border: 1px solid #0E6B38;
    border-bottom: 4px solid #094D28;
    box-shadow: 0 6px 16px rgba(16,124,65,0.24);
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; box-shadow: 0 2px 8px rgba(16,124,65,0.2); }
  .btn:last-child { margin-bottom: 0; }
  .footer { text-align: center; margin-top: 28px; }
  .footer-label { font-size: 13px; color: #475569; font-weight: 700; margin-bottom: 12px; }
  .socials { display: flex; justify-content: center; gap: 18px; }
  .social-link {
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; transition: transform 0.15s ease;
  }
  .social-link img { width: 28px; height: 28px; object-fit: contain; display: block; }
  .social-link:hover { transform: scale(1.12); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="profile">
      <img src="profile.png" alt="Irshad Shebin" />
      <h1>Irshad Shebin</h1>
      <p>Finance &nbsp;|&nbsp; Accounting &nbsp;|&nbsp; Taxation</p>
    </div>

    <div class="card">
      <span class="badge">FREE RESOURCE</span>
      <h2>Master Excel Dashboard</h2>
      <p>Build a live executive Sales &amp; Profit Dashboard with dynamic Slicers, KPI cards, and 1-click refresh.</p>
      <a class="btn" href="Master_Excel_Dashboard_Tutorial_Guide.pdf" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Step-by-Step PDF Guide
      </a>
      <a class="btn" href="Master_Excel_Dashboard_Practice.xlsx" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Practice Excel File (.xlsx)
      </a>
    </div>

    <div class="footer">
      <div class="footer-label">Follow @irshadshebin</div>
      <div class="socials">
        <a class="social-link" href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
          <img src="linkedin.png" alt="LinkedIn" />
        </a>
        <a class="social-link" href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="instagram.png" alt="Instagram" />
        </a>
      </div>
    </div>
  </div>
</body>
</html>
