media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: Page Settings & Resource Cards
    path: resources.json
    type: file
    fields:
      - name: items
        label: 1. Resources List (Add & Edit Download Cards Here)
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string

      - name: profileImage
        label: 2. Profile — Photo
        type: image
        default: profile.png
      - name: profileName
        label: 2. Profile — Display Name
        type: string
        default: Irshad Shebin
      - name: profileTagline
        label: 2. Profile — Bio Subline
        type: string
        default: Finance | Accounting | Taxation

      - name: showSearchFilter
        label: 3. Navigation — Show Search & Category Filter Bar
        type: boolean
        default: false
      - name: showViewAllBtn
        label: 3. Navigation — Show "View All Free Resources" Pill (on #id links)
        type: boolean
        default: true
      - name: viewAllBtnText
        label: 3. Navigation — View All Button Text
        type: string
        default: View All Free Resources
      - name: showPortfolioLink
        label: 3. Navigation — Show "View My Portfolio & CV" Pill Button
        type: boolean
        default: true
      - name: portfolioBtnText
        label: 3. Navigation — Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: 3. Navigation — Portfolio / CV URL
        type: string
        default: https://github.io

      - name: showConsultationCta
        label: 4. Consultation — Show Consultation / WhatsApp Banner
        type: boolean
        default: false
      - name: consultationBadge
        label: 4. Consultation — Top Badge
        type: string
        default: 1-ON-1 CONSULTATION
      - name: consultationTitle
        label: 4. Consultation — Banner Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: 4. Consultation — Banner Subtitle
        type: string
        default: Book a 1-on-1 consultation or message directly on WhatsApp.
      - name: consultationBtnText
        label: 4. Consultation — Button Text
        type: string
        default: Chat on WhatsApp
      - name: consultationUrl
        label: 4. Consultation — WhatsApp or Booking URL
        type: string
        default: https://wa.me

      - name: showFooterSocials
        label: 5. Footer & Icons — Show Footer Follow Section
        type: boolean
        default: true
      - name: footerText
        label: 5. Footer & Icons — Follow Text
        type: string
        default: Follow @irshadshebin
      - name: showLinkedin
        label: 5. Footer & Icons — Show LinkedIn
        type: boolean
        default: true
      - name: linkedinUrl
        label: 5. Footer & Icons — LinkedIn URL
        type: string
        default: https://linkedin.com
      - name: showInstagram
        label: 5. Footer & Icons — Show Instagram
        type: boolean
        default: true
      - name: instagramUrl
        label: 5. Footer & Icons — Instagram URL
        type: string
        default: https://instagram.com
      - name: showThreads
        label: 5. Footer & Icons — Show Threads
        type: boolean
        default: true
      - name: threadsUrl
        label: 5. Footer & Icons — Threads URL
        type: string
        default: https://threads.net
      - name: showYoutube
        label: 5. Footer & Icons — Show YouTube
        type: boolean
        default: false
      - name: youtubeUrl
        label: 5. Footer & Icons — YouTube URL
        type: string
        default: https://youtube.com
      - name: showFacebook
        label: 5. Footer & Icons — Show Facebook
        type: boolean
        default: false
      - name: facebookUrl
        label: 5. Footer & Icons — Facebook URL
        type: string
        default: https://facebook.com
      - name: showX
        label: 5. Footer & Icons — Show X (Twitter)
        type: boolean
        default: false
      - name: xUrl
        label: 5. Footer & Icons — X (Twitter) URL
        type: string
        default: https://x.com
      - name: showTelegram
        label: 5. Footer & Icons — Show Telegram
        type: boolean
        default: false
      - name: telegramUrl
        label: 5. Footer & Icons — Telegram URL
        type: string
        default: https://t.me
      - name: showGithub
        label: 5. Footer & Icons — Show GitHub
        type: boolean
        default: false
      - name: githubUrl
        label: 5. Footer & Icons — GitHub URL
        type: string
        default: https://github.com
