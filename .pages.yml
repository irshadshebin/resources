content:
  - name: resources
    label: Page Settings & Resource Cards
    path: resources.json
    type: file
    fields:
      - name: footerText
        label: Footer Follow Text (e.g., Follow @irshadshebin)
        type: string
        default: Follow @irshadshebin
      - name: linkedinUrl
        label: LinkedIn Profile URL
        type: string
        default: https://linkedin.com
      - name: instagramUrl
        label: Instagram Profile URL
        type: string
        default: https://instagram.com
      - name: items
        label: Resources List
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: url
                label: Download or Resource URL
                type: string
