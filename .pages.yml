media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: Resource Cards
    path: resources.json
    type: file
    fields:
      - name: items
        label: Resources List (Drag to Reorder Cards)
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string
  - name: settings
    label: Page Settings
    path: settings.json
    type: file
    fields:
      - name: profileImage
        label: 1. Profile — Photo
        type: image
        default: profile.png
      - name: profileName
        label: 1. Profile — Display Name
        type: string
        default: Irshad Shebin | Finance & AI
      - name: profileTagline
        label: 1. Profile — Bio Subline (Press Enter for 2nd line)
        type: text

      - name: showConsultationCta
        label: 2. Consultation Card — Show 1-on-1 Consultation Card (ON / OFF)
        type: boolean
        default: false
      - name: consultationBadge
        label: 2. Consultation Card — Top Badge
        type: string
        default: 1-ON-1 CONSULTATION & INQUIRIES
      - name: consultationTitle
        label: 2. Consultation Card — Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: 2. Consultation Card — Subtitle
        type: string
        default: Book a 1-on-1 consultation or reach out directly for custom systems.

      - name: showDirectContact
        label: 3. Direct Contact Card — Show When Consultation Is OFF (ON / OFF)
        type: boolean
        default: true
      - name: contactCardBadge
        label: 3. Direct Contact Card — Top Badge
        type: string
        default: DIRECT CONTACT
      - name: contactCardTitle
        label: 3. Direct Contact Card — Title
        type: string
        default: Have a Question or Inquiry?
      - name: contactCardDesc
        label: 3. Direct Contact Card — Subtitle
        type: string
        default: Reach out directly via WhatsApp, Email, or Telegram.
      - name: contactList
        label: 3. Contact Buttons — Drag to Reorder (WhatsApp, Email, Telegram)
        type: object
        list: true
        fields:
          - name: channel
            label: Channel
            type: select
            options:
              values:
                - value: whatsapp
                  label: WhatsApp
                - value: email
                  label: Gmail / Email
                - value: telegram
                  label: Telegram
          - name: enabled
            label: Show Button (ON / OFF)
            type: boolean
            default: true
          - name: label
            label: Button Text (e.g., Chat on WhatsApp, Send Email)
            type: string
          - name: value
            label: Link or Email (e.g., https://wa.me or name@gmail.com)
            type: string
        - name: showSearchFilter
        label: 4. Navigation — Show Search & Category Bar (ON / OFF)
        type: boolean
        default: false
      - name: showViewAllBtn
        label: 4. Navigation — Show "View All Free Resources" Pill on #id Links (ON / OFF)
        type: boolean
        default: true
      - name: viewAllBtnText
        label: 4. Navigation — View All Button Text
        type: string
        default: View All Free Resources
      - name: showPortfolioLink
        label: 4. Navigation — Show "View My Portfolio & CV" Pill (ON / OFF)
        type: boolean
        default: true
      - name: portfolioBtnText
        label: 4. Navigation — Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: 4. Navigation — Portfolio / CV URL
        type: string
        default: https://github.io

      - name: showFooterSocials
        label: 5. Footer Follow Socials — Show Footer Section (ON / OFF)
        type: boolean
        default: true
      - name: footerText
        label: 5. Footer Follow Socials — Follow Text
        type: string
        default: Follow @irshadshebin
      - name: socialsList
        label: 5. Footer Follow Socials — Drag to Reorder Icons
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - value: instagram
                  label: Instagram
                - value: linkedin
                  label: LinkedIn
                - value: threads
                  label: Threads
                - value: youtube
                  label: YouTube
                - value: facebook
                  label: Facebook
                - value: x
                  label: X (Twitter)
                - value: github
                  label: GitHub
          - name: enabled
            label: Show Icon (ON / OFF)
            type: boolean
            default: true
          - name: url
            label: Profile URL
            type: string
