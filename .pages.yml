    <div class="footer">
      <div class="footer-label" id="footer-label">Follow @irshadshebin</div>
      <div class="socials">
        <a class="social-link" id="linkedin-link" href="https://linkedin.com" rel="noopener" aria-label="LinkedIn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#0A66C2"><path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.92 11.24V10.13H10.13V18.5H12.92V13.57C12.92 12.8 13.54 12.17 14.31 12.17A1.4 1.4 0 0 1 15.71 13.57V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z"/></svg>
        </a>
        <a class="social-link" id="instagram-link" href="https://instagram.com" rel="noopener" aria-label="Instagram">
          <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://w3.org">
            <defs>
              <radialGradient id="ig-official" cx="30%" cy="107%" r="150%">
                <stop offset="0%" stop-color="#fdf497"/>
                <stop offset="5%" stop-color="#fdf497"/>
                <stop offset="45%" stop-color="#fd5949"/>
                <stop offset="60%" stop-color="#d6249f"/>
                <stop offset="90%" stop-color="#285AEB"/>
              </radialGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#ig-official)"/>
            <rect x="5.2" y="5.2" width="13.6" height="13.6" rx="3.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3.3" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
            <circle cx="16.2" cy="7.8" r="1.1" fill="#FFFFFF"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    const icon = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    fetch('resources.json?v=' + Date.now()).then(r => r.json()).then(data => {
      if (data.footerText) document.getElementById('footer-label').textContent = data.footerText;
      if (data.linkedinUrl) document.getElementById('linkedin-link').href = data.linkedinUrl;
      if (data.instagramUrl) document.getElementById('instagram-link').href = data.instagramUrl;

      const box = document.getElementById('cards-container');
      (data.items || []).forEach(item => {
        const btns = (item.buttons || []).map(b => `<a class="btn" href="${b.url}" ${b.url.startsWith('http') ? 'target="_blank" rel="noopener"' : 'download'}>${icon}<span>${b.label}</span></a>`).join('');
        box.innerHTML += `<div id="${item.id}" class="card"><span class="badge">${item.badge || 'FREE RESOURCE'}</span><h2>${item.title}</h2><p>${item.description}</p>${btns}</div>`;
      });
      if (window.location.hash) {
        const el = document.querySelector(window.location.hash);
        if (el) { el.scrollIntoView({ behavior: 'smooth' }); el.classList.add('highlight'); setTimeout(() => el.classList.remove('highlight'), 2500); }
      }
    });
  </script>
</body>
</html>
