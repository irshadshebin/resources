media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: Page Settings & Resource Cards
    path: resources.json
    type: file
    fields:
      - name: items
        label: 1. Resources List (Drag to Reorder Cards)
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string

      - name: sectionsOrder
        label: 2. Page Layout Order (Drag to Reorder Sections & Toggle ON/OFF)
        type: object
        list: true
        fields:
          - name: section
            label: Page Section
            type: select
            options:
              values:
                - value: cards
                  label: Resource Download Cards
                - value: viewAllBtn
                  label: View All Free Resources Pill (Shows on #id links)
                - value: consultation
                  label: 1-on-1 Consultation / WhatsApp Card
                - value: portfolioBtn
                  label: View My Portfolio & CV Pill
          - name: enabled
            label: Show Section (ON / OFF)
            type: boolean
            default: true
                  - name: profileImage
        label: 3. Profile — Photo
        type: image
        default: profile.png
      - name: profileName
        label: 3. Profile — Display Name
        type: string
        default: Irshad Shebin
      - name: profileTagline
        label: 3. Profile — Bio Subline
        type: text
        default: Finance | Accounting | Taxation

      - name: showSearchFilter
        label: 4. Buttons & Search — Show Search & Category Filter Bar
        type: boolean
        default: false
      - name: viewAllBtnText
        label: 4. Buttons & Search — View All Button Text
        type: string
        default: View All Free Resources
      - name: portfolioBtnText
        label: 4. Buttons & Search — Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: 4. Buttons & Search — Portfolio / CV URL
        type: string
        default: https://github.io

      - name: consultationBadge
        label: 5. Consultation Card — Top Badge
        type: string
        default: 1-ON-1 CONSULTATION
      - name: consultationTitle
        label: 5. Consultation Card — Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: 5. Consultation Card — Subtitle
        type: string
        default: Book a 1-on-1 consultation or message directly on WhatsApp.
      - name: consultationBtnText
        label: 5. Consultation Card — Button Text
        type: string
        default: Chat on WhatsApp
      - name: consultationUrl
        label: 5. Consultation Card — WhatsApp or Booking URL
        type: string
        default: https://wa.me

      - name: showFooterSocials
        label: 6. Footer & Socials — Show Footer Section
        type: boolean
        default: true
      - name: footerText
        label: 6. Footer & Socials — Follow Text
        type: string
        default: Follow @irshadshebin
      - name: socialsList
        label: 6. Footer & Socials — Drag to Reorder Social Icons
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - value: instagram
                  label: Instagram
                - value: linkedin
                  label: LinkedIn
                - value: threads
                  label: Threads
                - value: gmail
                  label: Gmail
                - value: youtube
                  label: YouTube
                - value: facebook
                  label: Facebook
                - value: x
                  label: X (Twitter)
                - value: telegram
                  label: Telegram
                - value: github
                  label: GitHub
          - name: enabled
            label: Show Icon (ON / OFF)
            type: boolean
            default: true
          - name: url
            label: Profile URL (For Gmail type your email e.g. name@gmail.com)
            type: string

