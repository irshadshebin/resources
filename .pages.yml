media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: 1. Resource Cards
    path: resources.json
    type: file
    fields:
      - name: items
        label: Resources List (Drag to Reorder Cards)
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string

  - name: profile
    label: 2. Profile
    path: profile.json
    type: file
    fields:
      - name: profileImage
        label: Profile Photo
        type: image
        default: profile.png
      - name: profileName
        label: Display Name
        type: string
        default: Irshad Shebin | Finance & AI
      - name: profileTagline
        label: Bio Subline (Press Enter for 2nd line)
        type: text
  - name: contact
    label: 3. Contact & Consultation
    path: contact.json
    type: file
    fields:
      - name: showConsultationCta
        label: Show Dark Consultation Card (ON / OFF)
        type: boolean
        default: false
      - name: consultationBadge
        label: Consultation Card — Top Badge
        type: string
        default: 1-ON-1 CONSULTATION & INQUIRIES
      - name: consultationTitle
        label: Consultation Card — Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: Consultation Card — Subtitle
        type: string
        default: Book a 1-on-1 consultation or reach out directly for custom systems.
      - name: showDirectContact
        label: Show White Direct Contact Card When Consultation Is OFF (ON / OFF)
        type: boolean
        default: true
      - name: contactCardBadge
        label: Direct Contact Card — Top Badge
        type: string
        default: DIRECT CONTACT
      - name: contactCardTitle
        label: Direct Contact Card — Title
        type: string
        default: Have a Question or Inquiry?
      - name: contactCardDesc
        label: Direct Contact Card — Subtitle
        type: string
        default: Reach out directly via WhatsApp, Email, or Telegram.
      - name: contactList
        label: Contact Buttons — Drag to Reorder (WhatsApp, Email, Telegram)
        type: object
        list: true
        fields:
          - name: channel
            label: Channel
            type: select
            options:
              values:
                - value: whatsapp
                  label: WhatsApp
                - value: email
                  label: Gmail / Email
                - value: telegram
                  label: Telegram
          - name: enabled
            label: Show Button (ON / OFF)
            type: boolean
            default: true
          - name: label
            label: Button Text (e.g., Chat on WhatsApp, Send Email)
            type: string
          - name: value
            label: Link or Email (e.g., https://wa.me or name@gmail.com)
            type: string
  - name: navigation
    label: 4. Navigation Buttons
    path: navigation.json
    type: file
    fields:
      - name: showSearchFilter
        label: Show Search & Category Bar (ON / OFF)
        type: boolean
        default: false
      - name: showViewAllBtn
        label: Show "View All Free Resources" Pill on #id Links (ON / OFF)
        type: boolean
        default: true
      - name: viewAllBtnText
        label: View All Button Text
        type: string
        default: View All Free Resources
      - name: showPortfolioLink
        label: Show "View My Portfolio & CV" Pill (ON / OFF)
        type: boolean
        default: true
      - name: portfolioBtnText
        label: Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: Portfolio / CV URL
        type: string
        default: https://github.io

  - name: footer
    label: 5. Footer Socials
    path: footer.json
    type: file
    fields:
      - name: showFooterSocials
        label: Show Footer Follow Section (ON / OFF)
        type: boolean
        default: true
      - name: footerText
        label: Footer Follow Text
        type: string
        default: Follow @irshadshebin
      - name: socialsList
        label: Social Icons — Drag to Reorder
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - value: instagram
                  label: Instagram
                - value: linkedin
                  label: LinkedIn
                - value: threads
                  label: Threads
                - value: youtube
                  label: YouTube
                - value: facebook
                  label: Facebook
                - value: x
                  label: X (Twitter)
                - value: github
                  label: GitHub
          - name: enabled
            label: Show Icon (ON / OFF)
            type: boolean
            default: true
          - name: url
            label: Profile URL
            type: string
