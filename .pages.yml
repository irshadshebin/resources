media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: Page Settings & Resource Cards
    path: resources.json
    type: file
    fields:
      - name: profileImage
        label: Profile Photo
        type: image
        default: profile.png
      - name: profileName
        label: Display Name
        type: string
        default: Irshad Shebin
      - name: profileTagline
        label: Bio Tagline
        type: string
        default: Finance | Accounting | Taxation
      - name: showSearchFilter
        label: Show Search & Category Filter Bar
        type: boolean
        default: false
      - name: showConsultationCta
        label: Show Consultation / WhatsApp Banner
        type: boolean
        default: false
      - name: consultationBadge
        label: Consultation Top Badge
        type: string
        default: 1-ON-1 CONSULTATION
      - name: consultationTitle
        label: Consultation Banner Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: Consultation Banner Subtitle
        type: string
        default: Book a 1-on-1 consultation or message directly on WhatsApp.
      - name: consultationBtnText
        label: Consultation Button Text
        type: string
        default: Chat on WhatsApp
      - name: consultationUrl
        label: WhatsApp or Booking URL (e.g., https://wa.me)
        type: string
        default: https://wa.me
      - name: showPortfolioLink
        label: Show "View My Portfolio & CV" Pill Button
        type: boolean
        default: true
      - name: portfolioBtnText
        label: Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: Portfolio / CV URL
        type: string
        default: https://github.io
      - name: showViewAllBtn
        label: Show "View All Free Resources" Pill (Appears on #id single-card links)
        type: boolean
        default: true
      - name: viewAllBtnText
        label: View All Button Text
        type: string
        default: View All Free Resources
      - name: showFooterSocials
        label: Show Footer Follow & Social Icons Section
        type: boolean
        default: true
      - name: footerText
        label: Footer Follow Text
        type: string
        default: Follow @irshadshebin
      - name: showLinkedin
        label: Show LinkedIn
        type: boolean
        default: true
      - name: linkedinUrl
        label: LinkedIn Profile URL
        type: string
        default: https://linkedin.com
      - name: showInstagram
        label: Show Instagram
        type: boolean
        default: true
      - name: instagramUrl
        label: Instagram Profile URL
        type: string
        default: https://instagram.com
      - name: showThreads
        label: Show Threads
        type: boolean
        default: true
      - name: threadsUrl
        label: Threads Profile URL
        type: string
        default: https://threads.net
      - name: showYoutube
        label: Show YouTube
        type: boolean
        default: false
      - name: youtubeUrl
        label: YouTube Channel URL
        type: string
        default: https://youtube.com
      - name: showFacebook
        label: Show Facebook
        type: boolean
        default: false
      - name: facebookUrl
        label: Facebook Page URL
        type: string
        default: https://facebook.com
      - name: showX
        label: Show X (Twitter)
        type: boolean
        default: false
      - name: xUrl
        label: X (Twitter) Profile URL
        type: string
        default: https://x.com
      - name: showTelegram
        label: Show Telegram
        type: boolean
        default: false
      - name: telegramUrl
        label: Telegram Channel / Handle URL
        type: string
        default: https://t.me
      - name: showGithub
        label: Show GitHub
        type: boolean
        default: false
      - name: githubUrl
        label: GitHub Profile URL
        type: string
        default: https://github.com
      - name: items
        label: Resources List
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload Any File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string
