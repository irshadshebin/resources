media:
  input: uploads
  output: uploads

content:
  - name: resources
    label: Resource Cards
    path: resources.json
    type: file
    fields:
      - name: items
        label: Resources List (Drag to Reorder Cards)
        type: object
        list: true
        fields:
          - name: id
            label: Anchor ID (for Auto-DM link, e.g., excel-dashboard)
            type: string
            required: true
          - name: category
            label: Category (e.g., Excel, Taxation, Accounting, Finance)
            type: string
            default: Excel
          - name: badge
            label: Top Badge (e.g., FREE RESOURCE)
            type: string
            default: FREE RESOURCE
          - name: title
            label: Resource Title
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: buttons
            label: Download / Action Buttons
            type: object
            list: true
            fields:
              - name: label
                label: Button Text
                type: string
              - name: file
                label: Option A — Upload File (PDF, Word, Excel, Image, Video, Audio)
                type: file
              - name: url
                label: Option B — Or Paste Website / YouTube / Google Drive URL
                type: string

  - name: settings
    label: Page Settings
    path: settings.json
    type: file
    fields:
      - name: profileImage
        label: 1. Profile — Photo
        type: image
        default: profile.png
      - name: profileName
        label: 1. Profile — Display Name
        type: string
        default: Irshad Shebin | Finance & AI
      - name: profileTagline
        label: 1. Profile — Bio Subline (Press Enter for 2nd line)
        type: text

      - name: showConsultationCta
        label: 2. Consultation & Direct Contact — Show Card (ON / OFF)
        type: boolean
        default: false
      - name: consultationBadge
        label: 2. Consultation — Top Badge
        type: string
        default: 1-ON-1 CONSULTATION & INQUIRIES
      - name: consultationTitle
        label: 2. Consultation — Card Title
        type: string
        default: Need Tax, GST, or Excel Help?
      - name: consultationDesc
        label: 2. Consultation — Subtitle
        type: string
        default: Book a 1-on-1 consultation or reach out directly for custom systems.
      - name: showWhatsappBtn
        label: 2. Contact — Show WhatsApp Button (ON / OFF)
        type: boolean
        default: true
      - name: whatsappBtnText
        label: 2. Contact — WhatsApp Button Text
        type: string
        default: Chat on WhatsApp
      - name: whatsappUrl
        label: 2. Contact — WhatsApp Link (e.g., https://wa.me)
        type: string
        default: https://wa.me
      - name: showEmailBtn
        label: 2. Contact — Show Email Button (ON / OFF)
        type: boolean
        default: true
      - name: emailBtnText
        label: 2. Contact — Email Button Text
        type: string
        default: Send Email
      - name: emailAddress
        label: 2. Contact — Your Email Address
        type: string
        default: irshadsbn7@gmail.com
      - name: showTelegramBtn
        label: 2. Contact — Show Telegram Button (ON / OFF)
        type: boolean
        default: false
      - name: telegramBtnText
        label: 2. Contact — Telegram Button Text
        type: string
        default: Message on Telegram
      - name: telegramUrl
        label: 2. Contact — Telegram Link
        type: string
        default: https://t.me
      - name: showSearchFilter
        label: 3. Navigation — Show Search & Category Bar (ON / OFF)
        type: boolean
        default: false
      - name: showViewAllBtn
        label: 3. Navigation — Show "View All Free Resources" Pill on #id Links (ON / OFF)
        type: boolean
        default: true
      - name: viewAllBtnText
        label: 3. Navigation — View All Button Text
        type: string
        default: View All Free Resources
      - name: showPortfolioLink
        label: 3. Navigation — Show "View My Portfolio & CV" Pill (ON / OFF)
        type: boolean
        default: true
      - name: portfolioBtnText
        label: 3. Navigation — Portfolio Button Text
        type: string
        default: View My Portfolio & CV
      - name: portfolioUrl
        label: 3. Navigation — Portfolio / CV URL
        type: string
        default: https://github.io

      - name: showFooterSocials
        label: 4. Footer Follow Socials — Show Footer Section (ON / OFF)
        type: boolean
        default: true
      - name: footerText
        label: 4. Footer Follow Socials — Follow Text
        type: string
        default: Follow @irshadshebin
      - name: socialsList
        label: 4. Footer Follow Socials — Drag to Reorder Icons
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - value: instagram
                  label: Instagram
                - value: linkedin
                  label: LinkedIn
                - value: threads
                  label: Threads
                - value: youtube
                  label: YouTube
                - value: facebook
                  label: Facebook
                - value: x
                  label: X (Twitter)
                - value: github
                  label: GitHub
          - name: enabled
            label: Show Icon (ON / OFF)
            type: boolean
            default: true
          - name: url
            label: Profile URL
            type: string
